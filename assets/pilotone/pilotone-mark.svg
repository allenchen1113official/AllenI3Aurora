<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="PilotOne">
  <defs>
    <linearGradient id="aurora" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3DDC97"/>
      <stop offset="0.5" stop-color="#2DD4BF"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
  </defs>
  <!-- 夜空底 -->
  <rect width="64" height="64" rx="16" fill="#0B1020"/>
  <!-- 極光環：航線 -->
  <circle cx="32" cy="32" r="21" fill="none" stroke="url(#aurora)" stroke-width="3.5" stroke-dasharray="104 28" stroke-linecap="round" transform="rotate(-70 32 32)"/>
  <!-- 「1」：一次製作、一鍵起飛 -->
  <path d="M29 20 L36 16 L36 46 L30 46 L30 24 L26 26 Z" fill="#F4F7FF"/>
  <!-- 航點 -->
  <circle cx="47" cy="19" r="3.2" fill="#FFC24B"/>
