<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>常看 YouTube · 重點筆記 — 艾倫報報</title>
<meta name="description" content="艾倫報報常看 YouTube 頻道的重點筆記：每支影片的繁中摘要與康乃爾筆記。Allen I³ Aurora。">
<link rel="icon" href="/AllenI3Aurora/assets/favicon-32x32.png">
<link rel="stylesheet" href="/AllenI3Aurora/styles.css">
<meta property="og:type" content="website">
<meta property="og:title" content="常看 YouTube · 重點筆記 — 艾倫報報">
<meta property="og:description" content="常看頻道每支影片的繁中摘要與康乃爾筆記。">
<style>
  html, body { height: auto; }
  body { margin: 0; min-height: 100vh; color: var(--text-2); }
  a { color: inherit; }
  .wrap { max-width: 920px; margin: 0 auto; padding: var(--space-8, 28px) var(--gutter, 20px) var(--space-24, 96px); }
  .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 28px; }
  .brand { display: inline-flex; align-items: center; gap: 10px; text-decoration: none; }
  .brand .mark { width: 36px; height: 36px; border-radius: 11px; background: var(--aurora-gradient); display: grid; place-items: center; font-family: var(--font-display, system-ui); font-weight: 900; font-size: 12px; color: var(--text-on-accent, #0b0d12); }
  .brand .name { font-family: var(--font-display, system-ui); font-weight: 900; font-size: 18px; color: var(--text-1); letter-spacing: .02em; }
  .back { font-size: 14px; color: var(--text-3); text-decoration: none; border: 1px solid var(--border); border-radius: var(--radius-pill, 999px); padding: 7px 15px; }
  h1 { font-family: var(--font-display, system-ui); font-weight: 900; font-size: clamp(1.8rem, 5vw, 2.6rem); line-height: 1.1; letter-spacing: -.02em; color: var(--text-1); margin: 0 0 14px; }
  .dek { color: var(--text-2); font-size: 1.02rem; line-height: 1.7; margin: 0 0 20px; max-width: 68ch; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 20px; }
  .chip { border: 1px solid var(--border); background: transparent; color: var(--text-2); border-radius: var(--radius-pill, 999px); padding: 6px 13px; font-size: 13px; cursor: pointer; font-family: inherit; }
  .chip.on { background: var(--brand, #7dd3fc); color: var(--text-on-accent, #0b0d12); border-color: transparent; font-weight: 700; }
  .list { display: grid; gap: 14px; }
  .card { border: 1px solid var(--border); border-radius: var(--radius-xl, 24px); background: var(--night-800); box-shadow: var(--shadow-card); padding: 16px 18px; scroll-margin-top: 20px; }
  .head { display: flex; gap: 14px; align-items: flex-start; }
  .thumb { width: 128px; aspect-ratio: 16/9; flex: none; border-radius: 10px; object-fit: cover; border: 1px solid var(--border); background: #0b0d12; }
  .meta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 12px; color: var(--text-3); font-family: var(--font-mono, monospace); }
  .badge { font-family: inherit; font-size: 11.5px; padding: 2px 9px; border-radius: 999px; border: 1px solid var(--border); color: var(--text-2); }
  .badge.new { color: var(--brand, #7dd3fc); border-color: var(--brand, #7dd3fc); }
  .ttl { font-family: var(--font-display, system-ui); font-weight: 800; color: var(--text-1); font-size: 16px; line-height: 1.4; margin-top: 6px; }
  .hl { color: var(--text-2); font-size: 13.5px; margin-top: 4px; line-height: 1.55; }
  ul.sum { color: var(--text-2); font-size: 13.5px; line-height: 1.75; margin: 12px 0 0; padding-left: 18px; }
  details { border-top: 1px solid var(--border-subtle, var(--border)); margin-top: 12px; padding-top: 10px; }
  summary { cursor: pointer; color: var(--text-3); font-size: 13px; }
  table.cornell { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 13px; line-height: 1.6; }
  table.cornell td { border-top: 1px solid var(--border-subtle, var(--border)); padding: 8px 6px; vertical-align: top; }
  table.cornell td.cue { width: 28%; color: var(--text-1); font-weight: 700; }
  .csum { margin-top: 8px; font-size: 13px; color: var(--text-1); background: rgba(125, 211, 252, .08); border-radius: 10px; padding: 8px 12px; }
  .acts { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  .btn { font-size: 13px; text-decoration: none; border: 1px solid var(--border); border-radius: var(--radius-pill, 999px); padding: 6px 14px; color: var(--text-2); }
  .empty { color: var(--text-3); padding: 30px 0; }
  .upd { color: var(--text-3); font-size: 12px; margin-top: 22px; }
  @media (max-width: 560px) { .head { flex-direction: column; } .thumb { width: 100%; } }
</style>
</head>
<body class="aurora-bg">
<div class="wrap">
  <div class="top">
    <a class="brand" href="/AllenI3Aurora/"><span class="mark">AI³A</span><span class="name">艾倫報報</span></a>
    <a class="back" href="/AllenI3Aurora/#ytnotes">← 回首頁</a>
  </div>
  <h1>常看 YouTube · 重點筆記</h1>
  <p class="dek">常看頻道的每支新影片，整理成繁中重點摘要與康乃爾筆記，新到舊排列。</p>
  <div id="chips" class="chips"></div>
  <div id="list" class="list empty">載入中…</div>
  <div id="upd" class="upd"></div>
</div>
<script>
(function () {
  var el = document.getElementById("list"), chipsEl = document.getElementById("chips");
  var esc = function (s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]; }); };
  var safeUrl = function (u) { return /^https:\/\//.test(u || "") ? u : ""; };
  var items = [], filter = "";

  function card(v, i) {
    var c = v.cornell || {}, rows = c.rows || [];
    var thumb = safeUrl(v.thumbnail) ? '<img class="thumb" loading="lazy" src="' + esc(v.thumbnail) + '" alt="">' : "";
    var sum = (v.summary || []).map(function (x) { return "<li>" + esc(x) + "</li>"; }).join("");
    var cornell = (rows.length || c.summary)
      ? '<details><summary>康乃爾筆記（' + rows.length + ' 則）</summary><table class="cornell">' +
        rows.map(function (r) { return '<tr><td class="cue">' + esc(r.cue) + "</td><td>" + esc(r.note) + "</td></tr>"; }).join("") +
        "</table>" + (c.summary ? '<div class="csum">摘要｜' + esc(c.summary) + "</div>" : "") + "</details>"
      : "";
    return '<article class="card" id="yt-' + esc(v.id) + '"><div class="head">' + thumb + '<div style="flex:1;min-width:0">' +
      '<div class="meta"><span class="badge">' + esc(v.author || "YouTube") + "</span>" +
      (v.category ? '<span class="badge">' + esc(v.category) + "</span>" : "") +
      (i === 0 && !filter ? '<span class="badge new">最新筆記</span>' : "") +
      "<span>" + esc([String(v.date || "").replace(/-/g, "."), v.duration].filter(Boolean).join(" · ")) + "</span></div>" +
      '<div class="ttl">' + esc(v.title) + "</div>" +
      (v.headline ? '<div class="hl">' + esc(v.headline) + "</div>" : "") +
      "</div></div>" +
      (sum ? '<ul class="sum">' + sum + "</ul>" : "") + cornell +
      '<div class="acts">' +
      '<a class="btn" href="/AllenI3Aurora/?yt=' + encodeURIComponent(v.id) + '#ytnotes">筆記圖卡</a>' +
      (safeUrl(v.url) ? '<a class="btn" href="' + esc(v.url) + '" target="_blank" rel="noopener noreferrer">前往觀看 ↗</a>' : "") +
      "</div></article>";
  }

  function render() {
    var shown = filter ? items.filter(function (v) { return (v.author || "YouTube") === filter; }) : items;
    el.className = "list";
    el.innerHTML = shown.map(card).join("");
    chipsEl.querySelectorAll(".chip").forEach(function (b) { b.classList.toggle("on", b.getAttribute("data-a") === filter); });
  }

  fetch("/AllenI3Aurora/data/ytnotes.json", { cache: "no-store" })
    .then(function (r) { return r.ok ? r.json() : null; })
    .then(function (d) {
      items = (d && Array.isArray(d.items)) ? d.items : [];
      if (!items.length) { el.textContent = "筆記整理中，敬請期待。"; return; }
      var authors = [];
      items.forEach(function (v) { var a = v.author || "YouTube"; if (authors.indexOf(a) === -1) authors.push(a); });
      if (authors.length > 1) {
        chipsEl.innerHTML = '<button class="chip" data-a="">全部（' + items.length + "）</button>" +
          authors.map(function (a) { return '<button class="chip" data-a="' + esc(a) + '">' + esc(a) + "</button>"; }).join("");
        chipsEl.addEventListener("click", function (e) { var b = e.target.closest(".chip"); if (b) { filter = b.getAttribute("data-a"); render(); } });
      }
      render();
      if (d.updatedAt) document.getElementById("upd").textContent = "資料更新：" + String(d.updatedAt).replace("T", " ").slice(0, 16) + "（台北時間）";
      if (location.hash) { var t = document.getElementById(location.hash.slice(1)); if (t) t.scrollIntoView(); }
    })
    .catch(function () { el.textContent = "讀取失敗，請稍後再試。"; });
})();
</script>
</body>
</html>
