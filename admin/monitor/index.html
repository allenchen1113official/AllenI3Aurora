<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B1020">
<meta name="robots" content="noindex">
<title>排程監控 · 艾倫報報後台</title>
<meta name="description" content="艾倫報報 ALLEN I³ AURORA 排程監控：GitHub Actions、Claude 排程與資料產出的即時健康度，並可自後台重新執行。">
<link rel="icon" href="/AllenI3Aurora/assets/favicon-32x32.png">
<link rel="apple-touch-icon" href="/AllenI3Aurora/assets/apple-touch-icon.png">
<link rel="stylesheet" href="/AllenI3Aurora/styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="/AllenI3Aurora/firebase-config.js"></script>
<script>window.AURORA_MONITOR = true; /* 以排程監控獨立殼載入後台（admin.jsx 讀此旗標） */</script>
<script type="module">
  import * as core from "/AllenI3Aurora/scripts/monitor/core.mjs";
  import * as registry from "/AllenI3Aurora/scripts/monitor/registry.mjs";
  window.AuroraMonitorCore = { ...core, registry };
  window.dispatchEvent(new Event("aurora-monitor-core"));
</script>
<style>
  html, body { height: 100%; margin: 0; }
  body { background: var(--night-900, #05070f); }
  #root { min-height: 100vh; min-height: 100dvh; }
  .ad-in { width: 100%; box-sizing: border-box; padding: 10px 12px; background: var(--night-800); color: var(--text-1);
           border: 1px solid var(--border); border-radius: var(--radius-md); font-size: 16px; font-family: var(--font-body); outline: none; }
  .ad-in:focus { border-color: var(--brand); }
  .ad-btn { cursor: pointer; border-radius: var(--radius-md); font-family: var(--font-display); font-weight: 700; font-size: 13.5px; text-decoration: none; display: inline-flex; align-items: center;
            padding: 9px 14px; border: 1px solid var(--border); background: var(--night-700); color: var(--text-1); transition: filter .15s; }
  .ad-btn:hover { filter: brightness(1.1); }
  .ad-btn:disabled { opacity: .5; cursor: not-allowed; }
  .ad-btn.primary { background: var(--aurora-gradient); border-color: transparent; color: var(--text-on-accent); box-shadow: var(--glow-brand); }
  .ad-btn.danger  { background: transparent; border-color: var(--danger); color: var(--danger); }
  .ad-btn.ghost   { background: transparent; }
  label.ad-lbl { display: block; font-size: 11.5px; color: var(--text-3); margin: 0 0 5px; letter-spacing: .03em; font-weight: 600; }
  @media (max-width: 640px) { .ad-top { padding: 10px 12px !important; } .ad-top .ad-btn { padding: 7px 10px; font-size: 12.5px; } }
</style>
</head>
<body class="aurora-bg">
<div id="root"></div>
<script type="text/babel" src="../admin.jsx" data-presets="react"></script>
<script type="text/babel" src="../schedule-monitor.jsx" data-presets="react"></script>
</body>
</html>
