name: 社群自動發文（Facebook／Instagram／Threads／YouTube）

# 2026-11-21 改版「常駐輪詢」：本 repo 的 GitHub cron 嚴重節流，`*/10` 實測 2～8 小時才觸發一次，
# 核准／排程到期的貼文常拖超過 1 小時才發。改為比照 taiex-update.yml：任何一次喚醒（cron／監控代理補跑／
# PilotOne 核准觸發／手動）都在同一個 job 內常駐：
#   - 每 2 分鐘跑一次發文排程（publish-social-posts.mjs）→ 核准後或排程到期後 ≤ 2～3 分鐘發出
#   - 每 6 分鐘跑一次 Drive 橋接＋素材匯入＋審核通知（送審包進 PilotOne 草稿）
#   - 每 2 分鐘同步一次常看 YouTube 轉錄進度（Drive notes/youtube/_engine/progress.json → Firestore aurora_ops/ytnotes_progress，
#     PilotOne 中控台「YouTube 轉錄」面板；scripts/ytnotes/sync-progress.mjs，失敗不影響發文）
#   - 跑滿約 5.5 小時後以 workflow_dispatch 自我接力（GITHUB_TOKEN 觸發 workflow_dispatch 是 GitHub 允許的例外），
#     concurrency 讓新的一輪排隊到這一輪結束後立即接手，全天不中斷；下列 cron 與監控代理補跑只是保險。
#   - push 觸發與 dry_run 只跑單輪（不常駐）。
#
# 每 10 分鐘掃描 Firestore aurora_social_posts（queueState == 'pending'），
# 依後台核准與排程時間發文到 Facebook 粉專、Instagram、Threads：
#   - 預定時間在 20 分鐘～29 天內 → 交給 Meta 原生排程（分鐘級準時）
#   - 已到期 → 立即發布；原生排程到期後回頭對帳、撤銷請求則刪除 Meta 端排程
#   - IG／Threads 無原生排程：到期前 5 分鐘內以容器兩段式發布
#   - YouTube：核准後即上傳（可續傳），公開影片帶 publishAt 由 YouTube 定時公開
# 狀態機與重試規則見 scripts/social/core.mjs；設定步驟見 docs/SOCIAL_SOP.md。
#
# 0. Drive 橋接（scripts/social/drive-bridge.mjs，2026-11-18 起）：Mac mini 上的 Claude 發文排程不再用 Chrome 發文，
#    改在 Drive「AllenI3Aurora/<主題>/<YYYYMMDD>/pilotone/」寫送審包；本步驟以 GDRIVE_SERVICE_ACCOUNT 讀入並推到 content 分支。
# 發文前先執行「Claude 排程素材匯入」（scripts/social/ingest-content.mjs）：
#   讀 content 分支今天／昨天的 content/<topic>/<YYYYMMDD>/manifest.json，
#   圖卡轉 JPEG 推回 content 分支，建立／更新 aurora_social_posts/cs_<topic>_<YYYYMMDD>。
#   全部主題預設為草稿（後台 PilotOne 審核核准；未核准不發、不過期）；只有 Repo Variable SOCIAL_AUTO_TOPICS
#   明確列出、且 manifest 標記 autoPublish＋verified 者才直接發布。見 docs/SOCIAL_SOP.md 第九節。
# 匯入後執行審核通知（scripts/social/notify-review.mjs）：新的待審草稿以 Email＋LINE 通知 Allen。
#
# 需要的 Repo Secrets：
#   FIREBASE_SERVICE_ACCOUNT  服務帳戶 JSON（需加授「Cloud Datastore 使用者」角色）
#   META_PAGE_TOKEN           粉專 Token（系統使用者 Token，不會過期）
#   META_PAGE_ID              粉專 ID
#   META_IG_USER_ID           （選用）IG 商業帳號 ID，沿用 META_PAGE_TOKEN
#   THREADS_USER_ID           （選用）Threads 使用者 ID
#   THREADS_TOKEN             （選用）Threads 長效 Token，排程器每日自動續期
#   IG_TOKEN                  （選用）改用「Instagram 登入」的 IG 長效 Token（不需連結粉專，每日自動續期）
#   FB_PAGE_TOKEN / FB_PAGE_ID / IG_USER_ID
#                             （選用）META_PAGE_TOKEN / META_PAGE_ID / META_IG_USER_ID 的相容別名
#   GDRIVE_SERVICE_ACCOUNT    （Drive 橋接）與今日關注動態共用的唯讀服務帳戶
#   SMTP_HOST / SMTP_PORT / SMTP_USER / SMTP_PASS / MAIL_FROM
#                             （審核通知 Email）沿用電子報 Secrets；PILOTONE_NOTIFY_EMAIL 選用，預設 allenchen1113.official@gmail.com
#   LINE_CHANNEL_TOKEN / LINE_USER_ID
#                             （審核通知 LINE，選用）LINE Messaging API channel access token 與你的 userId
#   YT_CLIENT_ID / YT_CLIENT_SECRET / YT_REFRESH_TOKEN
#                             （選用）YouTube Data API OAuth；scripts/social/youtube-auth.mjs 取得
# 選用 Repo Variable：META_GRAPH_VERSION（預設 v25.0）
#                     META_PAGE_EXPECT_NAME（粉專預期名稱，預設「艾倫報報」；不符即暫停 FB，* 關閉檢查）
#                     SOCIAL_AUTO_TOPICS（允許自動發布的主題，逗號分隔；預設不設＝全部人工審核）
# 未設定的平台自動停用；全部未設定時只會印出警告並略過，不會失敗。
on:
  schedule:
    # 只是「喚醒保險」：常駐輪詢＋自我接力正常時，這些觸發只會排隊後接棒。避開整點以降低被丟棄機率。
    - cron: "7,37 * * * *"   # 台北每小時 :07、:37 喚醒（UTC 同分）
  push:
    branches: [main]
    paths:
      - ".github/workflows/social-publish.yml"
      - "scripts/social/**"
      - "scripts/ytnotes/sync-progress.mjs"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "只列出將執行的動作（不發文、不改資料）"
        type: boolean
        default: false
      loop:
        description: "常駐輪詢（每 2 分鐘發文、約 5.5 小時後自我接力）；關閉則只跑單輪"
        type: boolean
        default: true

concurrency:
  group: social-publish
  cancel-in-progress: false

permissions:
  contents: write   # 素材匯入需把 JPEG 圖卡與匯入紀錄推回 content 分支
  actions: write    # 常駐輪詢結束前以 workflow_dispatch 自我接力

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 355   # 常駐輪詢約 5.5 小時（GitHub 上限 6 小時）＋YouTube 上傳餘裕
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 行為測試
        run: |
          node --test scripts/social/publish.test.mjs scripts/social/youtube.test.mjs scripts/social/ingest.test.mjs scripts/social/bridge.test.mjs scripts/ytnotes/progress.test.mjs
          python3 -m unittest scripts/ytnotes/test_progress.py scripts/ytnotes/test_channels.py
      - name: 安裝 firebase-admin、sharp、googleapis、nodemailer
        run: npm install --no-save --no-audit --no-fund firebase-admin@13 sharp@0.34 googleapis@144 nodemailer@6
      - name: 取出 content 分支（Claude 排程素材）
        id: content
        continue-on-error: true   # 分支尚未建立時略過匯入，不影響發文
        uses: actions/checkout@v4
        with:
          ref: content
          path: .content
      - name: 常駐輪詢：Drive 橋接＋素材匯入＋審核通知＋發文
        env:
          GDRIVE_SERVICE_ACCOUNT: ${{ secrets.GDRIVE_SERVICE_ACCOUNT }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          SOCIAL_AUTO_TOPICS: ${{ vars.SOCIAL_AUTO_TOPICS }}
          INGEST_RESULT: ${{ runner.temp }}/ingest-result.json
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          PILOTONE_NOTIFY_EMAIL: ${{ secrets.PILOTONE_NOTIFY_EMAIL }}
          LINE_CHANNEL_TOKEN: ${{ secrets.LINE_CHANNEL_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          META_GRAPH_VERSION: ${{ vars.META_GRAPH_VERSION }}
          META_PAGE_EXPECT_NAME: ${{ vars.META_PAGE_EXPECT_NAME }}
          SOCIAL_DRY_RUN: ${{ (github.event_name == 'push' || inputs.dry_run) && '1' || '0' }}
          # schedule／未帶 loop 的 dispatch 皆常駐；push、dry_run 或 loop=false 只跑單輪
          SOCIAL_LOOP: ${{ (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && !inputs.dry_run && inputs.loop)) && '1' || '0' }}
          HAS_CONTENT: ${{ steps.content.outcome == 'success' && '1' || '0' }}
          GH_TOKEN: ${{ github.token }}
          LOOP_SECONDS: "19800"       # 常駐 5.5 小時
          PUBLISH_EVERY: "120"        # 發文每 2 分鐘
          INGEST_EVERY: "360"         # Drive 橋接＋匯入每 6 分鐘
        run: |
          if [[ "$HAS_CONTENT" == "1" ]]; then
            for d in .content; do
              git -C "$d" config user.name "github-actions[bot]"
              git -C "$d" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            done
          fi
          tpe() { TZ=Asia/Taipei date "+%m/%d %H:%M:%S"; }

          ingest_once() {
            [[ "$HAS_CONTENT" == "1" ]] || return 0
            # 每輪先同步 content 分支（上一輪或 Mac mini 排程可能已推新素材）
            git -C .content fetch -q origin content && git -C .content reset -q --hard origin/content \
              || echo "::warning::content 分支同步失敗，沿用本機版本"
            rm -f "$INGEST_RESULT"
            node scripts/social/drive-bridge.mjs .content || echo "::warning::Drive 橋接失敗（$(tpe)），下一輪再試"
            node scripts/social/ingest-content.mjs .content || echo "::warning::素材匯入失敗（$(tpe)），下一輪再試"
            node scripts/social/notify-review.mjs "$INGEST_RESULT" || echo "::warning::審核通知失敗（$(tpe)）"
          }

          # 常看 YouTube 轉錄進度 → aurora_ops/ytnotes_progress（只讀 Drive、只寫這一份文件；dry_run 只印不寫）
          progress_once() {
            node scripts/ytnotes/sync-progress.mjs || echo "::warning::轉錄進度同步失敗（$(tpe)），下一輪再試"
          }

          publish_fail=0
          publish_once() {
            if node scripts/social/publish-social-posts.mjs; then publish_fail=0
            else publish_fail=$((publish_fail+1)); echo "::warning::發文排程失敗（$(tpe)，連續 $publish_fail 次），下一輪再試"; fi
          }

          if [[ "$SOCIAL_LOOP" != "1" ]]; then
            echo "單輪模式（$(tpe)）"
            ingest_once; publish_once; progress_once
            exit $(( publish_fail > 0 ? 1 : 0 ))
          fi

          start=$(date +%s); last_ingest=0
          echo "常駐輪詢開始（台北 $(tpe)）：發文每 ${PUBLISH_EVERY}s、匯入每 ${INGEST_EVERY}s，約 $((LOOP_SECONDS/60)) 分鐘後接力。"
          while :; do
            now=$(date +%s)
            if (( now - last_ingest >= INGEST_EVERY )); then
              echo "::group::匯入 $(tpe)"; ingest_once; echo "::endgroup::"; last_ingest=$(date +%s)
            fi
            echo "::group::發文 $(tpe)"; publish_once; echo "::endgroup::"
            echo "::group::轉錄進度 $(tpe)"; progress_once; echo "::endgroup::"
            (( $(date +%s) - start >= LOOP_SECONDS )) && break
            sleep "$PUBLISH_EVERY"
          done

          # 自我接力：新的一輪會在本輪結束後立即開始（concurrency 排隊）
          if gh workflow run social-publish.yml --ref "${GITHUB_REF_NAME}" -R "$GITHUB_REPOSITORY"; then
            echo "已排入下一輪常駐輪詢（台北 $(tpe)）"
          else
            echo "::warning::自我接力失敗，改由 cron／監控代理喚醒"
          fi
          # 只有最後一輪發文仍失敗才標紅，避免偶發失敗讓整個 5.5 小時的執行顯示失敗
          exit $(( publish_fail > 0 ? 1 : 0 ))
