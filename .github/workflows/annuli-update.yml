name: 同步個人年輪

# 每日台北凌晨 01:00 從 AllenAnnuli（Supabase）同步大事紀與數字統計，
# 寫入同源 data/annuli.json 快照，供前端 annuli-live.js 即時讀取失敗時退回。
# 無需任何 Secret：AllenAnnuli 的 config.js 以網域衍生金鑰加密，
# 腳本以與瀏覽器端相同流程解密（僅 anon key，公開讀取權限）。
# 註：GitHub 排程以 UTC 計；台北 01:00 = UTC 17:00（前一日）。
on:
  schedule:
    - cron: "0 17 * * *"   # 台北每日凌晨 01:00
  push:
    branches: [main]
    paths:
      - ".github/workflows/annuli-update.yml"
      - "scripts/update-annuli.mjs"
  workflow_dispatch: {}

# 避免與其他排程重疊執行造成 push 衝突。
concurrency:
  group: annuli-update
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 同步 AllenAnnuli 並更新 data/annuli.json
        run: node scripts/update-annuli.mjs
      - name: 有變動才提交
        run: |
          if [[ -n "$(git status --porcelain data/annuli.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/annuli.json
            git commit -m "chore(annuli): 每日同步個人年輪 [skip ci]"
            git pull --rebase --autostash origin main || true
            git push
          else
            echo "個人年輪無變動，略過提交。"
          fi
