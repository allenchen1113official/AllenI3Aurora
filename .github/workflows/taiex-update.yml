name: 更新加權指數 TAIEX

# 伺服器端定時抓取證交所加權指數，寫入 data/taiex.json（同源，供前端讀取）。
# 區分交易／非交易時段：交易時段密集更新即時指數，非交易時段維持最新收盤。
# 註：GitHub 排程以 UTC 計；台北 = UTC+8。台股交易 09:00–13:30 = UTC 01:00–05:30。
on:
  schedule:
    - cron: "*/5 1-5 * * 1-5"   # 交易時段：台北週一至週五 09:00–13:59，每 5 分鐘
    - cron: "35 5 * * 1-5"       # 台北 13:35 收盤結算
    - cron: "0 7 * * 1-5"        # 台北 15:00 盤後確認
    - cron: "0 12 * * *"         # 台北 20:00 每日一次（非交易日／夜間維持最新）
  push:
    branches: [main]
    paths:
      - ".github/workflows/taiex-update.yml"
      - "scripts/update-taiex.mjs"
  workflow_dispatch: {}

# 避免多個排程重疊執行造成 push 衝突。
concurrency:
  group: taiex-update
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 抓取並更新 data/taiex.json
        run: node scripts/update-taiex.mjs
      - name: 有變動才提交
        run: |
          if [[ -n "$(git status --porcelain data/taiex.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/taiex.json
            git commit -m "chore(taiex): 自動更新加權指數 [skip ci]"
            git pull --rebase --autostash origin main || true
            git push
          else
            echo "指數無變動，略過提交。"
          fi
