name: 更新加權指數 TAIEX

# 伺服器端抓取證交所加權指數，寫入 data/taiex.json（同源，供前端讀取）。
#
# 更新規則（2026-11-26 改版，一律台北時間；時程邏輯在 scripts/taiex-schedule.mjs）：
#   1. 交易日交易期間（週一至週五 09:00–13:35）：即時更新，每 2 分鐘抓 MIS 即時指數。
#   2. 交易日收盤後：13:36、13:45 取收盤值，15:10 以 OpenAPI 再確認一次。
#   3. 其餘時間（夜間、週末、休市日）：每日凌晨 01:00 更新一次。
#
# 為什麼改成常駐：本 repo 的 GitHub cron 嚴重節流，開盤前的喚醒排程常被丟棄或延遲數小時
# （11/24 到 14:21、11/25 到 09:56 才開始輪詢，11/26 到中午仍未觸發），盤中首頁因此停在前一日收盤。
# 現在比照 social-publish.yml：任何一次喚醒都在同一個 job 內「睡到下一個更新時點 → 更新」循環，
# 跑滿約 5 小時 20 分後以 workflow_dispatch 自我接力（GITHUB_TOKEN 觸發 workflow_dispatch 是 GitHub
# 允許的例外），concurrency 讓下一輪排隊到本輪結束後立即接手，全天不中斷、不再依賴 cron 準時。
# 下列 cron 與監控代理補跑只是「接力鏈中斷時」的喚醒保險，刻意避開整點以降低被丟棄的機率。
# push 觸發（改到本檔或腳本時）同樣會進入常駐輪詢。
on:
  schedule:
    - cron: "43 0 * * 1-5"       # 台北週一至週五 08:43 喚醒（開盤前）
    - cron: "11 1 * * 1-5"       # 台北週一至週五 09:11 喚醒
    - cron: "23 2 * * 1-5"       # 台北週一至週五 10:23 喚醒
    - cron: "17 3 * * 1-5"       # 台北週一至週五 11:17 喚醒
    - cron: "41 4 * * 1-5"       # 台北週一至週五 12:41 喚醒
    - cron: "33 5 * * 1-5"       # 台北週一至週五 13:33 喚醒（收盤結算）
    - cron: "7 7 * * 1-5"        # 台北週一至週五 15:07 喚醒（盤後確認）
    - cron: "53 16 * * *"        # 台北每日 00:53 喚醒（每日 01:00 更新；UTC 為前一日 16:53）
  push:
    branches: [main]
    paths:
      - ".github/workflows/taiex-update.yml"
      - "scripts/update-taiex.mjs"
      - "scripts/taiex-schedule.mjs"
      - "scripts/update-taiex.test.mjs"
  workflow_dispatch:
    inputs:
      loop:
        description: "常駐輪詢（依時程更新、約 5 小時 20 分後自我接力）；關閉則只更新一次"
        type: boolean
        default: true

# 同時間只跑一個；新的一輪排隊等本輪結束（接力），不互相取消。
concurrency:
  group: taiex-update
  cancel-in-progress: false

permissions:
  contents: write
  actions: write    # 常駐輪詢結束前以 workflow_dispatch 自我接力

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 345   # 常駐約 5 小時 20 分＋餘裕（GitHub 單一 job 上限 6 小時）
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 單元測試（防回退、更新時程）
        run: node --test scripts/update-taiex.test.mjs
      - name: 依時程更新 data/taiex.json（常駐輪詢＋自我接力）
        env:
          GH_TOKEN: ${{ github.token }}
          TAIEX_LOOP: ${{ (github.event_name == 'workflow_dispatch' && inputs.loop == false) && '0' || '1' }}
          LOOP_SECONDS: "19200"   # 5 小時 20 分
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          tpe() { TZ=Asia/Taipei date "+%m/%d %H:%M:%S"; }

          update_once() {
            # 先對齊 main（常駐期間其他工作會持續推送），再抓取
            git pull -q --rebase --autostash origin main || echo "::warning::同步 main 失敗（$(tpe)），沿用本機版本"
            node scripts/update-taiex.mjs || echo "::warning::本輪抓取失敗（$(tpe)），下一輪再試"
            if [[ -n "$(git status --porcelain data/taiex.json)" ]]; then
              git add data/taiex.json
              git commit -q -m "chore(taiex): 自動更新加權指數 [skip ci]"
              for i in 1 2 3; do
                git pull -q --rebase --autostash origin main && git push -q && break
                echo "push 失敗，第 $i 次重試"; sleep 10
              done
            else
              echo "指數無變動，略過提交。"
            fi
          }

          # 每次喚醒先更新一次（補上接力空檔或被丟棄的排程）
          echo "::group::更新 $(tpe)"; update_once; echo "::endgroup::"
          if [[ "$TAIEX_LOOP" != "1" ]]; then echo "單次模式，結束。"; exit 0; fi

          start=$(date +%s)
          echo "常駐輪詢開始（台北 $(tpe)），約 $((LOOP_SECONDS/60)) 分鐘後接力。"
          while :; do
            read -r phase delay at < <(node scripts/taiex-schedule.mjs)
            left=$(( LOOP_SECONDS - ( $(date +%s) - start ) ))
            (( left > 0 )) || break
            if (( delay > left )); then
              echo "下次更新 ${at}（${phase}）在本輪結束之後，睡 ${left}s 後交給下一輪。"
              sleep "$left"; break
            fi
            echo "下次更新 ${at}（${phase}），睡 ${delay}s。"
            sleep "$delay"
            echo "::group::更新 $(tpe)（${phase}）"; update_once; echo "::endgroup::"
          done

          # 自我接力：新的一輪會在本輪結束後立即開始（concurrency 排隊）
          if gh workflow run taiex-update.yml --ref "${GITHUB_REF_NAME}" -R "$GITHUB_REPOSITORY"; then
            echo "已排入下一輪常駐輪詢（台北 $(tpe)）"
          else
            echo "::warning::自我接力失敗，改由 cron／監控代理喚醒"
          fi
