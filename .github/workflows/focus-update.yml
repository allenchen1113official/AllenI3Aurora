name: 更新今日關注動態

# 伺服器端定時讀取 Google Drive 今日資料夾，彙整成 data/focus.json（同源，
# 供前端「今日關注動態」讀取）。比照 TAIEX／運動的更新機制。
# 需在 Repo Settings → Secrets and variables → Actions 設定：
#   GDRIVE_SERVICE_ACCOUNT  （Google 服務帳戶金鑰 JSON 全文）
# 並將 Drive 的「AllenI3Aurora」資料夾以「檢視者」分享給該服務帳戶 email。
# 未設定時腳本會維持現有 data/focus.json 不變（不會失敗）。
# 註：GitHub 排程以 UTC 計；台北 = UTC+8。
on:
  schedule:
    - cron: "0 */3 * * *"   # 每 3 小時更新一次（涵蓋早間日報與盤後熱力圖）
  push:
    branches: [main]
    paths:
      - ".github/workflows/focus-update.yml"
      - "scripts/update-focus.mjs"
      - "scripts/update-issues.mjs"
  workflow_dispatch: {}

# 避免多個排程重疊執行造成 push 衝突。
concurrency:
  group: focus-update
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 安裝相依套件
        run: npm install --no-save googleapis
      - name: 讀取 Drive 並更新 data/focus.json
        env:
          GDRIVE_SERVICE_ACCOUNT: ${{ secrets.GDRIVE_SERVICE_ACCOUNT }}
        run: node scripts/update-focus.mjs
      - name: 讀取 Drive 並更新 data/newsletter-current.json（本期報報）
        env:
          GDRIVE_SERVICE_ACCOUNT: ${{ secrets.GDRIVE_SERVICE_ACCOUNT }}
        run: node scripts/update-issues.mjs
      - name: 有變動才提交
        run: |
          if [[ -n "$(git status --porcelain data/focus.json data/newsletter-current.json data/heatmap.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/focus.json data/newsletter-current.json data/heatmap.json
            git commit -m "chore(newsletter): 自動更新今日關注動態與本期報報 [skip ci]"
            git pull --rebase --autostash origin main || true
            git push
          else
            echo "今日關注動態與本期報報無變動，略過提交。"
          fi
