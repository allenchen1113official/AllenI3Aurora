<script>
(function () {
  var SITE = "https://allenchen1113official.github.io/AllenI3Aurora/";
  var PAGE = SITE + "stockradar.html";
  var TITLE = "台股選股雷達 · TOP 10 訊號排行 — 艾倫報報";

  // 內建預設（data/stockradar.json 取得後覆蓋），確保 JSON 讀取失敗仍可顯示。
  var DEFAULTS = {
    date: "", dateLabel: "訊號雷達",
    summary: "台股選股雷達 · TOP 10 訊號排行：KD 黃金交叉、均線多頭、營益率／營收年增／EPS 年增，技術面與基本面轉強名單一次看，用訊號選股不再靠猜。洞察世界·累積智慧·點亮未來，完整訊號雷達看這裡👇",
    hashtags: "#台股 #選股 #選股雷達 #訊號雷達 #TOP10 #KD黃金交叉 #艾倫報報 #AllenI3Aurora #洞察世界 #累積智慧 #點亮未來",
    signals: [
      { key: "gc", label: "KD黃金交叉", desc: "日 K 前一交易日 K≦D、當日 K＞D 翻轉向上" },
      { key: "ma", label: "均線多頭", desc: "月線＞季線＞半年線＞年線，且四條均線皆向上" },
      { key: "om", label: "營益率＞10%", desc: "近 4 季逾 3 季單季營業利益率高於 10%" },
      { key: "rev", label: "營收年增＞20%", desc: "近 4 季逾 3 季單季營收年增率高於 20%" },
      { key: "eps", label: "EPS年增＞10%", desc: "近 4 季逾 3 季單季稅後 EPS 年增率高於 10%" }
    ],
    top10: [],
    radar: { title: "TOP 10 訊號雷達", subtitle: "技術面轉強名單 · 依綜合訊號強度排序", drive: "", local: "assets/stockradar/stockradar-ig.png" },
    source: "", note: ""
  };

  var SIG_COLOR = { gc: "var(--illumination)", ma: "var(--insight)", om: "var(--intelligence)", rev: "var(--brand)", eps: "var(--finance-up)" };
  function esc(s) { return String(s == null ? "" : s); }
  function escAttr(s) { return esc(s).replace(/"/g, "&quot;"); }

  function renderSignals(d) {
    var box = document.getElementById("signals");
    box.innerHTML = (d.signals || []).map(function (s) {
      var c = SIG_COLOR[s.key] || "var(--brand)";
      return '<div class="sig"><div class="h"><span class="sw" style="background:' + c + '"></span>' + esc(s.label) + '</div>' +
             '<div class="d">' + esc(s.desc) + '</div></div>';
    }).join("");
  }

  function renderRank(d) {
    var panel = document.getElementById("rankPanel");
    var list = Array.isArray(d.top10) ? d.top10 : [];
    if (!list.length) { panel.hidden = true; return; }
    panel.hidden = false;
    var rows = list.map(function (r, i) {
      var up = (typeof r.up === "boolean") ? r.up : (String(r.changePct || "").indexOf("-") !== 0);
      var chg = [esc(r.change), esc(r.changePct)].filter(Boolean).join(" ");
      var tags = (r.signals || []).map(function (k) {
        var lbl = { gc: "KD黃金交叉", ma: "均線多頭", om: "營益率>10%", rev: "營收年增>20%", eps: "EPS年增>10%" }[k] || k;
        return '<span class="pill ' + esc(k) + '">' + esc(lbl) + '</span>';
      }).join("");
      return '<tr><td class="n">' + (i + 1) + '</td>' +
             '<td class="nm">' + esc(r.name || "") + (r.code ? '<small>' + esc(r.code) + '</small>' : '') + '</td>' +
             '<td class="hide-sm"><div class="tags">' + tags + '</div></td>' +
             '<td class="pct ' + (up ? "up" : "down") + '">' + (chg || "—") + '</td></tr>';
    }).join("");
    document.getElementById("rankTable").innerHTML =
      '<thead><tr><th>#</th><th>個股</th><th class="hide-sm">訊號</th><th style="text-align:right">漲跌幅</th></tr></thead><tbody>' + rows + '</tbody>';
  }

  function renderRadar(d) {
    var m = d.radar || {};
    document.getElementById("radar-t").textContent = esc(m.title || "TOP 10 訊號雷達");
    document.getElementById("radar-s").textContent = esc(m.subtitle || "");
    var local = esc(m.local || "assets/stockradar/stockradar-ig.png"); // 站內備援圖卡（頁面相對路徑，可能非當日）
    var drive = esc(m.drive);                                          // data 管線每日排程更新的「當日最新」圖卡
    var img = document.getElementById("radar-img");
    // 優先顯示每日排程更新的 Drive 最新圖卡，確保圖卡與 TOP10 排行同為當日資料；
    // 載入失敗（Drive 偶發不穩）才退回站內備援圖，避免無圖。
    if (drive) { img.onerror = function () { img.onerror = null; img.src = local; }; img.src = drive; }
    else { img.src = local; }
  }

  function renderSource(d) {
    var a = document.getElementById("source");
    if (d.source) { a.href = d.source; a.hidden = false; } else { a.hidden = true; }
  }

  var toastTimer = null;
  function notify(msg) {
    var t = document.getElementById("toast");
    t.textContent = msg; t.classList.add("show");
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove("show"); }, 2800);
  }
  function copyText(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(text).then(function () { return true; }, function () { return legacyCopy(text); });
    }
    return Promise.resolve(legacyCopy(text));
  }
  function legacyCopy(text) {
    try { var ta = document.createElement("textarea"); ta.value = text; ta.style.position = "fixed"; ta.style.top = "-9999px"; document.body.appendChild(ta); ta.focus(); ta.select(); var ok = document.execCommand("copy"); document.body.removeChild(ta); return ok; } catch (e) { return false; }
  }
  function openShareWindow(url) { var w = window.open(url, "_blank", "noopener,noreferrer,width=640,height=720"); if (!w) window.open(url, "_blank", "noopener,noreferrer"); }

  // 貼文文字：摘要 ＋ 來源連結 ＋ 主題標籤（Facebook／Instagram 用）。
  function socialPost(d) { return [d.summary, "🔗 " + PAGE, d.hashtags].join("\n\n"); }
  // Threads intent 需 text 與 url 分開帶入。
  function threadsText(d) { return [d.summary, d.hashtags].join("\n\n"); }

  function wireShare(d) {
    var post = socialPost(d);

    // 一鍵分享：優先系統原生分享（行動裝置可直接選 IG／FB／Threads，帶入摘要與連結），
    // 桌面退回複製完整貼文供貼上。
    function nativeOrCopy(okMsg) {
      if (navigator.share) {
        navigator.share({ title: TITLE, text: post, url: PAGE }).catch(function () {});
        return true;
      }
      copyText(post).then(function (ok) { notify(ok ? okMsg : "請手動複製貼文內容分享 📋"); });
      return false;
    }

    document.getElementById("share").addEventListener("click", function () {
      nativeOrCopy("已複製摘要與連結，貼上即可分享 📋");
    });

    // Facebook：sharer.php 僅能附連結，無法預填貼文文字，故先複製完整貼文再開分享視窗。
    document.getElementById("fb").addEventListener("click", function () {
      if (navigator.share) { navigator.share({ title: TITLE, text: post, url: PAGE }).catch(function () {}); return; }
      copyText(post).then(function (ok) {
        openShareWindow("https://www.facebook.com/sharer/sharer.php?u=" + encodeURIComponent(PAGE));
        notify(ok ? "已複製完整貼文（摘要＋hashtag），在 Facebook 貼上（Ctrl/⌘+V）即可發表 📋" : "請手動複製貼文內容，貼到 Facebook 發表 📋");
      });
    });

    // Instagram：無網頁預填介面；行動裝置優先系統原生分享，否則複製貼文後開啟 Instagram。
    document.getElementById("ig").addEventListener("click", function () {
      if (navigator.share) { navigator.share({ title: TITLE, text: post, url: PAGE }).catch(function () {}); return; }
      copyText(post).then(function (ok) {
        openShareWindow("https://www.instagram.com/");
        notify(ok ? "已複製摘要與 hashtag，Instagram 貼文貼上即可完成分享 📋" : "請手動複製貼文內容，貼到 Instagram 分享 📋");
      });
    });

    // Threads：官方 intent/post 可預填文案與連結。
    document.getElementById("th").addEventListener("click", function () {
      openShareWindow("https://www.threads.net/intent/post?text=" + encodeURIComponent(threadsText(d)) + "&url=" + encodeURIComponent(PAGE));
    });
  }

  function apply(d) {
    document.getElementById("b-date").textContent = (d.dateLabel || "訊號雷達");
    if (d.summary) {
      var lead = d.summary.replace(/^【[^】]*】/, "").replace(/洞察世界[·].*$/, "").trim();
      if (lead) document.getElementById("dek").textContent = lead;
    }
    document.getElementById("note").textContent = d.note || "";
