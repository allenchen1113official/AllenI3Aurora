<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>台股盤前速報 — 艾倫報報</title>
<meta name="description" content="台股盤前速報：昨日收盤與三大法人、隔夜美股、類股輪動與今日觀察點，開盤前三分鐘掌握多空關鍵。艾倫報報 Allen I³ Aurora。">
<link rel="icon" href="/AllenI3Aurora/assets/favicon-32x32.png">
<link rel="stylesheet" href="/AllenI3Aurora/styles.css">
<!-- 開放社群預覽（Facebook 分享時顯示圖與說明）：採盤前速報品牌圖卡（1200x630） -->
<meta property="og:type" content="article">
<meta property="og:title" content="台股盤前速報 — 艾倫報報">
<meta property="og:description" content="昨日收盤與三大法人、隔夜美股、類股輪動與今日觀察點，開盤前三分鐘掌握多空關鍵。">
<meta property="og:image" content="https://allenchen1113official.github.io/AllenI3Aurora/assets/prebrief/prebrief-card.png">
<meta name="twitter:card" content="summary_large_image">
<style>
  html, body { height: auto; }
  body { margin: 0; min-height: 100vh; color: var(--text-2); }
  a { color: inherit; }
  .wrap { max-width: 1040px; margin: 0 auto; padding: var(--space-8, 28px) var(--gutter, 20px) var(--space-24, 96px); }
  .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 28px; }
  .brand { display: inline-flex; align-items: center; gap: 10px; text-decoration: none; }
  .brand .mark { width: 36px; height: 36px; border-radius: 11px; background: var(--aurora-gradient); display: grid; place-items: center; font-family: var(--font-display, system-ui); font-weight: 900; font-size: 15px; color: var(--text-on-accent); }
  .brand .name { font-family: var(--font-display, system-ui); font-weight: 900; font-size: 18px; color: var(--text-1); letter-spacing: .02em; }
  .back { font-size: 14px; color: var(--text-3); text-decoration: none; border: 1px solid var(--border); border-radius: var(--radius-pill, 999px); padding: 7px 15px; transition: .18s; }
  .back:hover { color: var(--text-1); border-color: var(--border-strong); }
  .badges { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
  .badge { font-size: 12.5px; font-weight: 700; letter-spacing: .04em; padding: 5px 12px; border-radius: var(--radius-pill, 999px); border: 1px solid var(--border); color: var(--text-2); background: var(--night-800); }
  .badge.tag { background: var(--insight-soft); color: var(--insight); border-color: transparent; }
  h1 { font-family: var(--font-display, system-ui); font-weight: 900; font-size: clamp(1.9rem, 5vw, 2.8rem); line-height: 1.1; letter-spacing: -.02em; color: var(--text-1); margin: 0 0 14px; }
  .dek { color: var(--text-2); font-size: 1.05rem; line-height: 1.7; margin: 0 0 26px; max-width: 68ch; }
  .figure { border: 1px solid var(--border); border-radius: var(--radius-xl, 24px); overflow: hidden; background: #0b0d12; box-shadow: var(--shadow-card); margin: 0 0 26px; }
  .figure img { display: block; width: 100%; height: auto; }
  .figure .cap { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; padding: 12px 18px; border-top: 1px solid var(--border-subtle); background: var(--night-800); font-size: 12.5px; color: var(--text-3); }
  .brief { border: 1px solid var(--border); border-radius: var(--radius-xl, 24px); overflow: hidden; background: var(--night-800); box-shadow: var(--shadow-card); }
  .brief .hd { display: flex; align-items: baseline; gap: 10px; padding: 18px 22px 6px; flex-wrap: wrap; }
  .brief .hd .t { font-family: var(--font-display, system-ui); font-weight: 900; font-size: 1.15rem; color: var(--text-1); }
  .brief .hd .s { font-size: 13px; color: var(--text-3); }
  .brief ol { margin: 8px 0 6px; padding: 0 22px 14px 22px; list-style: none; counter-reset: hl; }
  .brief li { counter-increment: hl; display: flex; gap: 14px; align-items: flex-start; padding: 12px 0; border-bottom: 1px solid var(--border-subtle); font-size: 15px; line-height: 1.7; color: var(--text-2); }
  .brief li:last-child { border-bottom: none; }
  .brief li::before { content: counter(hl); flex: none; width: 26px; height: 26px; border-radius: 8px; background: var(--insight-soft); color: var(--insight); font-family: var(--font-mono, ui-monospace); font-weight: 800; font-size: 13px; display: grid; place-items: center; margin-top: 2px; }
  .actions { display: flex; gap: 10px; flex-wrap: wrap; margin: 30px 0 10px; }
  .btn { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 700; padding: 11px 18px; border-radius: var(--radius-pill, 999px); border: 1px solid var(--border-strong); background: var(--night-800); color: var(--text-1); cursor: pointer; transition: .18s; font-family: inherit; text-decoration: none; }
  .btn:hover { border-color: var(--brand); box-shadow: var(--focus-ring); }
  .btn.primary { background: var(--aurora-gradient); color: var(--text-on-accent); border-color: transparent; }
  .btn.fb { background: #1877F2; color: #fff; border-color: transparent; }
  .note { margin-top: 22px; font-size: 12.5px; color: var(--text-4); line-height: 1.6; border-top: 1px solid var(--border-subtle); padding-top: 16px; }
  .toast { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%); z-index: 500; background: var(--night-700); color: var(--text-1); border: 1px solid var(--border); border-radius: var(--radius-md, 14px); padding: 12px 18px; font-size: 14px; line-height: 1.4; box-shadow: var(--shadow-lg); max-width: min(90vw, 460px); text-align: center; opacity: 0; pointer-events: none; transition: opacity .2s; }
  .toast.show { opacity: 1; }
  @media (max-width: 640px) { .wrap { padding-left: 16px; padding-right: 16px; } }
</style>
</head>
<body class="aurora-bg">
<div class="wrap">
  <div class="top">
    <a class="brand" href="/AllenI3Aurora/">
      <span class="mark">I³</span><span class="name">艾倫報報</span>
    </a>
    <a class="back" href="/AllenI3Aurora/">← 回儀表板</a>
  </div>

  <div class="badges">
    <span class="badge tag">盤前 · PRE-MARKET</span>
    <span class="badge" id="b-date">盤前速報</span>
    <span class="badge">開盤前必讀</span>
  </div>

  <h1>台股盤前速報</h1>
  <p class="dek" id="dek">昨日收盤與三大法人、隔夜美股、類股輪動與今日觀察點，開盤前三分鐘掌握多空關鍵。</p>

  <!-- 當日盤前速報圖卡：優先 Drive 當日圖檔（data/prebrief.json 的 image），
       沒有時退回站內品牌圖卡 assets/prebrief/prebrief-card.png。 -->
  <figure class="figure">
    <img id="card-img" loading="lazy" alt="台股盤前速報圖卡"
      src="/AllenI3Aurora/assets/prebrief/prebrief-card.png">
    <figcaption class="cap"><span id="cap-t">台股盤前速報</span><span id="cap-d"></span></figcaption>
  </figure>

  <div class="brief">
    <div class="hd"><span class="t">今日盤前重點</span><span class="s" id="hl-sub">自當日盤前速報彙整</span></div>
    <ol id="highlights"></ol>
  </div>

  <div class="actions">
    <button class="btn primary" id="full">📄 開啟完整速報</button>
    <button class="btn" id="share">🔗 一鍵分享</button>
    <button class="btn fb" id="fb"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="4.5"/><path d="M14.5 8H13a1.5 1.5 0 0 0-1.5 1.5V21"/><path d="M9.5 13h5"/></svg>分享到 Facebook</button>
  </div>

  <p class="note" id="note"></p>
</div>
<div class="toast" id="toast"></div>

<script>
(function () {
  var SITE = "https://allenchen1113official.github.io/AllenI3Aurora/";
  var PAGE = SITE + "prebrief.html";
  // 內建預設（data/prebrief.json 取得後覆蓋），確保即使 JSON 讀取失敗仍可顯示。
  var DEFAULTS = {
    date: "", dateLabel: "盤前速報",
    summary: "台股盤前速報：昨日收盤與三大法人、隔夜美股、類股輪動與今日觀察點，開盤前三分鐘掌握多空關鍵。完整盤前速報看這裡👇",
    hashtags: "#台股 #盤前速報 #艾倫極光報報 #加權指數 #三大法人 #艾倫報報 #AllenI3Aurora #洞察世界 #累積智慧 #點亮未來",
    highlights: [],
    source: "",
    note: "本內容為資料彙整，非投資建議。完整內容以 Google Drive 當日盤前速報原文為準；本頁為重點摘要呈現。"
  };

  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  function renderHighlights(d) {
    var box = document.getElementById("highlights");
    var rows = Array.isArray(d.highlights) ? d.highlights : [];
    if (!rows.length) {
      box.innerHTML = '<li>今日盤前重點尚未產出，請稍後再回來，或直接開啟完整速報。</li>';
      return;
    }
    box.innerHTML = rows.map(function (t) { return "<li>" + esc(t) + "</li>"; }).join("");
  }

  var toastTimer = null;
  function notify(msg) {
    var t = document.getElementById("toast");
    t.textContent = msg; t.classList.add("show");
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove("show"); }, 2800);
  }
  function copyText(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(text).then(function () { return true; }, function () { return legacyCopy(text); });
    }
    return Promise.resolve(legacyCopy(text));
  }
  function legacyCopy(text) {
    try { var ta = document.createElement("textarea"); ta.value = text; ta.style.position = "fixed"; ta.style.top = "-9999px"; document.body.appendChild(ta); ta.focus(); ta.select(); var ok = document.execCommand("copy"); document.body.removeChild(ta); return ok; } catch (e) { return false; }
  }
  function openShareWindow(url) { var w = window.open(url, "_blank", "noopener,noreferrer,width=640,height=720"); if (!w) window.open(url, "_blank", "noopener,noreferrer"); }

  function socialPost(d) { return [d.summary, "🔗 " + PAGE, d.hashtags].join("\n\n"); }

  // 資料會先以預設、後以 data/prebrief.json 各套用一次；事件監聽只掛一次，
  // 內容一律讀取「當前資料」CURRENT，避免重複掛載造成分享視窗開兩次。
  var CURRENT = DEFAULTS;
  function wireActions() {
    document.getElementById("full").addEventListener("click", function () {
      if (CURRENT.source) { window.open(CURRENT.source, "_blank", "noopener,noreferrer"); return; }
      notify("完整速報連結尚未產出，請稍後再試 🙏");
    });
    document.getElementById("share").addEventListener("click", function () {
      var post = socialPost(CURRENT);
      if (navigator.share) {
        navigator.share({ title: "台股盤前速報 — 艾倫報報", text: post, url: PAGE }).catch(function () {});
        return;
      }
      copyText(post).then(function (ok) { notify(ok ? "已複製摘要與連結，貼上即可分享 📋" : "請手動複製分享文字 📋"); });
    });
    document.getElementById("fb").addEventListener("click", function () {
      // 比照站內分享：優先系統原生分享（帶入完整貼文文字＋hashtag），
      // 桌面退回時先複製完整貼文、再開啟 Facebook 分享視窗供貼上。
      var post = socialPost(CURRENT);
      if (navigator.share) {
        navigator.share({ title: "台股盤前速報 — 艾倫報報", text: post, url: PAGE }).catch(function () {});
        return;
      }
      copyText(post).then(function (ok) {
        openShareWindow("https://www.facebook.com/sharer/sharer.php?u=" + encodeURIComponent(PAGE) + "&quote=" + encodeURIComponent(post));
        notify(ok ? "已複製完整貼文（摘要＋hashtag），在 Facebook 貼上（Ctrl/⌘+V）即可發表 📋" : "請手動複製貼文內容，貼到 Facebook 發表 📋");
      });
    });
  }

  function apply(d) {
    CURRENT = d;
    document.getElementById("b-date").textContent = d.dateLabel ? (d.dateLabel + " 盤前速報") : "盤前速報";
    if (d.summary) document.getElementById("dek").textContent = d.summary;
    document.getElementById("hl-sub").textContent = d.date ? ("自 " + d.date + " 盤前速報彙整") : "自當日盤前速報彙整";
    document.getElementById("note").textContent = d.note || DEFAULTS.note;
    renderCard(d);
    renderHighlights(d);
  }

  // 圖卡：Drive 當日圖檔（image）優先，載入失敗或沒有時退回站內品牌圖卡。
  var LOCAL_CARD = "/AllenI3Aurora/assets/prebrief/prebrief-card.png";
  function renderCard(d) {
    var img = document.getElementById("card-img");
    img.onerror = function () { img.onerror = null; img.src = LOCAL_CARD; };
    img.src = d.image || LOCAL_CARD;
    document.getElementById("cap-d").textContent = d.date ? (d.date + (d.image ? " · 當日圖卡" : " · 品牌圖卡")) : "";
  }

  // 先套用預設立即可見，再以 data/prebrief.json 覆蓋（Drive 最新一日的彙整）。
  wireActions();
  apply(DEFAULTS);
  fetch("/AllenI3Aurora/data/prebrief.json", { cache: "no-store" })
    .then(function (r) { return r.ok ? r.json() : null; })
    .then(function (j) { if (j) { var d = Object.assign({}, DEFAULTS, j); apply(d); } })
    .catch(function () {});
})();
</script>
</body>
</html>
